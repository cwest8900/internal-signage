name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://cwest8900.github.io/internal-signage/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates config.js using the secret stored in GitHub
      - name: Generate config.js
        run: |
          echo "const API_KEY = '${{ secrets.CALENDAR_API_KEY }}';" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
